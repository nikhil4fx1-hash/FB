name: Auto Facebook Post

on:
  schedule:
    # രാവിലെ 7:30 AM IST (02:00 UTC)
    - cron: '0 2 * * *'
    # ഉച്ചയ്ക്ക് 1:00 PM IST (07:30 UTC)
    - cron: '30 7 * * *'
    # വൈകുന്നേരം 5:00 PM IST (11:30 UTC)
    - cron: '30 11 * * *'
    # രാത്രി 9:30 PM IST (16:00 UTC)
    - cron: '0 16 * * *'
  workflow_dispatch: # മാനുവൽ ആയി റൺ ചെയ്യാനുള്ള ഓപ്ഷൻ

jobs:
  post_to_fb:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests feedparser pillow duckduckgo-search

    - name: Run Python Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      run: python main.py
